<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dropdown menu</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <ul class="container">
        <li class="item">Item 1</li>

        <li class="item dropdown1">
            Item 2
            <span>›</span>

            <ul class="dropdown-content">
                <li class="dropdown-item">Item 2.1</li>
                <li class="dropdown-item">Item 2.2</li>
                <li class="dropdown-item">
                    Item 2.3
                    <span>›</span>

                    <ul class="dropdown-content2">
                        <li class="dropdown-item2">Item 2.3.1</li>
                        <li class="dropdown-item2">Item 2.3.2</li>
                        <li class="dropdown-item2">Item 2.3.3</li>
                    </ul>
                </li>
            </ul>
        </li>

        <li class="item">Item 3</li>
        <li class="item">Item 4</li>
    </ul>
</body>

</html>
